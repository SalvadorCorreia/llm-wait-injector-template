<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <div class="header">
    <h2>Extension Settings</h2>
  </div>
  
  <div class="analytics-card">
    <div>
      <span class="label">Wait Time Tracked:</span>
      <span class="value" id="time-display">0m 0s</span>
    </div>
    <button id="reset-time-btn" class="reset-btn">Reset</button>
  </div>

  <div class="settings-group">
    <label class="toggle-row">
      <span>Enable Extension</span>
      <input type="checkbox" id="global-toggle">
    </label>
  </div>

  <div class="settings-group">
    <details>
      <summary>Providers</summary>
      <div id="provider-list"></div>
    </details>
  </div>

  <div class="settings-group custom-settings">
    <h3>Payload Settings</h3>
    <p class="hint">Developers: Add custom payload controls here.</p>
  </div>

  <script src="../core/src/registry.js"></script>
  <script src="menu.js"></script>
</body>
</html>
